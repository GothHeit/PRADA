[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prada"
version = "0.1.0"
description = "Personal Reasoning Autonomous Distributed Agent"
requires-python = ">=3.11"
dependencies = ["ollama>=0.6.2", "pydantic>=2.13"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
prada = "prada.cli:main"

[tool.setuptools]
packages = ["prada", "tutor"]

[tool.setuptools.package-data]
tutor = ["evalset/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
