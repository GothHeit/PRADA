[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prada"
version = "0.1.0"
description = "Personal Reasoning Autonomous Distributed Agent"
requires-python = ">=3.11"
dependencies = ["ollama>=0.6.2", "pydantic>=2.13"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# The voice loop's side (e.g. Windows): mic, speakers and offline speech engines.
voice = [
    "openwakeword>=0.6",
    "pywhispercpp>=1.5",
    "piper-tts>=1.3",
    "sounddevice>=0.5",
    "numpy>=1.24",
]
# Training your own wake words (`prada voice train`, Linux/WSL, Python 3.11: openwakeword
# needs tflite-runtime there, which has no newer wheels). Several GB, mostly PyTorch.
wakeword = [
    "openwakeword>=0.6",
    "piper-tts==1.3.0",  # what piper-sample-generator 3.2.0 (downloaded by --setup) needs
    "webrtcvad-wheels>=2.0.14",
    "torch>=2.6,<2.9",  # 2.6+: torch.load defaults to weights_only (the phonemizer check)
    "torchaudio>=2.6,<2.9",  # 2.9 moved audio loading to torchcodec (needs FFmpeg)
    "torchinfo>=1.8",
    "torchmetrics>=1.2",
    "onnx>=1.14",  # exporting the trained model
    "speechbrain>=0.5.14,<1",
    "audiomentations>=0.33",
    "torch-audiomentations>=0.11",
    "acoustics>=0.2.6",
    "mutagen>=1.47",
    "pronouncing>=0.2",
    "deep-phonemizer==0.0.19",
    "pyyaml>=6",
    "scipy>=1.10,<1.17",  # acoustics imports scipy.special.sph_harm, gone in 1.17
    "soundfile>=0.12",
]

[project.scripts]
prada = "prada.cli:main"

[tool.setuptools]
packages = ["prada", "prada.voice", "tutor"]

[tool.setuptools.package-data]
tutor = ["evalset/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
